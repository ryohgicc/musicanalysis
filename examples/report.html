<script>
'use strict';
const bundle=JSON.parse(document.getElementById('report-data').textContent),R=bundle.report,N=bundle.playlist.tracks.length;
const chronological=R.order!=='unknown',reverse=R.order==='last-oldest';
const direction=chronological?(reverse?`第 ${N} 首较早 → 第 1 首较新`:`第 1 首较早 → 第 ${N} 首较新`):'按歌单原序分段 · 不代表收藏时间';
const colors=['#7f95ff','#e7a17f','#b99be5','#65ad97','#e997ae','#d2a848','#6e9fba','#a9a879','#d18f75'];
// Adapt the public analysis contract once; every playlist shares this template.
const D={...bundle,stages:R.stages.map((s,i)=>({...s,start:s.range[reverse?1:0],end:s.range[reverse?0:1],sub:s.subtitle||'',ids:s.anchorIds,cover:s.coverIndex||s.anchorIds[0],color:colors[i%colors.length]})),
 insights:R.insights.map((s,i)=>({...s,id:`insight-${i+1}`,no:String(i+1).padStart(2,'0'),kicker:s.kicker||'LISTENING THREAD',recommendations:s.recommendationIds||R.recommendations.flatMap((r,j)=>r.anchorIds.some(id=>s.evidence.some(e=>e.index===id))?[j]:[]).slice(0,3)})),recommendations:R.recommendations,
 artworkNotes:R.trackArtwork||{},recommendationArtwork:Object.fromEntries(R.recommendations.map((r,i)=>[i,{image:bundle.recommendationCovers?.[i],album:r.artwork?.label||'',source:r.artwork?.source||''}]))};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>{try{const u=new URL(s);return /^https?:$/.test(u.protocol)?esc(u.href):'';}catch{return '';}};
const num=n=>String(n).padStart(2,'0'),songMap=new Map(D.playlist.tracks.map(t=>[t.index,t]));
const backgrounds=['#edf0fc','#f6eee5','#f0eaf7','#e9f3ef','#f8ecef','#f7f1de','#e8f0f5','#f0f1e4','#f8ece4'];
const external=(url,label)=>safe(url)?`<a href="${safe(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<span>${label}</span>`;
const songLink=(id,label)=>{const t=songMap.get(id);return external(t.sourceUrl,esc(label||t.title));};
const artNote=id=>D.artworkNotes[id]?.kind==='artist'?`<span class="art-note">艺人图 · 原条目无专辑封面 · ${external(D.artworkNotes[id].source,'图片来源')}</span>`:'';
const cover=id=>D.covers[id]?`<img src="${D.covers[id]}" alt="${esc(D.artworkNotes[id]?.kind==='artist'?`${D.artworkNotes[id].label} 艺人图片 · 原条目无专辑封面`:`${songMap.get(id)?.album||songMap.get(id)?.title} 专辑封面`)}">`:'<div class="missing-art" role="img" aria-label="封面暂缺">♫</div>';
const button=(href,label,secondary=false)=>`<a class="button${secondary?' secondary':''}" href="${href}">${label}<span class="arrow" aria-hidden="true">↗</span></a>`;
const record=(id,tag,no)=>{const t=songMap.get(id);return `<div class="record kinetic" data-kinetic="record"><div class="disc" aria-hidden="true"></div><figure class="record-cover">${cover(id)}<figcaption>${esc(t.title)}<small>${esc(t.artist)}</small>${artNote(id)}</figcaption></figure><span class="record-mark">SIDE ${num(no)} / ${esc(tag)}</span></div>`;};
const recommendationArt=i=>{const art=D.recommendationArtwork?.[i];return art?.image?.startsWith('data:image/')?`<img src="${esc(art.image)}" alt="${esc(D.recommendations[i].artist)}《${esc(D.recommendations[i].title)}》封面" width="300" height="300">`:'<span class="small">封面暂缺</span>';};
const panels=[];
function panel(id,label,group,cls,html,style=''){panels.push({id,label,group,cls,html,style});}
panel('home','从喜欢开始','home','home',`<div class="split"><div class="kinetic" data-kinetic="copy"><p class="kicker">YOUR PERSONAL LISTENING ATLAS</p><h1 class="display" id="report-title">${esc(R.title)}</h1><p class="lead">${esc(R.summary)}</p><div class="actions">${button('#journey','展开我的音乐地图')}${button('#discover','发现下一首',true)}</div><div class="metadata"><div><b class="mono">${N}</b>首收藏</div><div><b class="mono">${num(D.stages.length)}</b>段旅程</div><div><b class="mono">${num(D.recommendations.length)}</b>首待探索</div></div><p class="source-line" id="source-line">${D.preview?'预览 · 内容未完成':'完整报告'} · ${N} 首收藏</p><p class="hero-note">${esc(D.playlist.name)} · 模板 ${esc(D.templateVersion)}</p></div><div class="collage">${D.heroIndices.slice(0,3).map(id=>{const t=songMap.get(id);return `<figure class="floating-cover">${cover(id)}<figcaption>${esc(t.title)}<small>${esc(t.artist)}</small></figcaption></figure>`;}).join('')}<span class="collage-label">THE SOUND OF YOUR COLLECTION</span></div></div>`);

const exportDialog=$('#image-export'),exportTrigger=$('#export-image'),exportStart=$('#start-export');
let exportBusy=false,exportCancelled=false,exportURLs=[],exportFocus=null;
function releaseExport(){exportURLs.forEach(url=>URL.revokeObjectURL(url));exportURLs=[];$('#export-preview').replaceChildren();$('#export-parts').replaceChildren();$('#download-image').removeAttribute('href');$('#open-image').removeAttribute('href');$('#export-result').hidden=true;}
function exportStatus(message){$('#export-status').textContent=message;}

function canvasBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('浏览器未能编码长图，请关闭其他页面后重试。')),'image/png'));}
function allocateExportCanvas(width,height){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)throw Error('浏览器不支持图片画布。');ctx.fillStyle='#f7f5ef';ctx.fillRect(0,0,width,height);ctx.fillStyle='#3357ff';ctx.fillRect(width-1,height-1,1,1);if(ctx.getImageData(width-1,height-1,1,1).data[2]!==255)throw Error('浏览器图片尺寸不足。');return canvas;}
exportStart.onclick=async()=>{
 if(exportBusy)return;
 exportBusy=true;exportCancelled=false;exportStart.disabled=true;exportTrigger.disabled=true;$('#export-quality').disabled=true;releaseExport();
 const progress=$('#export-progress');progress.hidden=false;progress.value=0;exportStatus('正在准备报告与封面…');
 let frame,output;
 try{
  if(typeof html2canvas!=='function')throw Error('截图组件未加载，请重新打开完整 HTML 文件。');
  frame=document.createElement('iframe');frame.setAttribute('aria-hidden','true');frame.tabIndex=-1;
  const width=1080,captureHeight=720;
  frame.style.cssText=`position:fixed;left:-100000px;top:0;width:${width}px;height:${captureHeight}px;border:0;pointer-events:none`;
  const loaded=new Promise(resolve=>frame.onload=resolve);
  frame.srcdoc='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>'+document.querySelector('style').textContent+'</style></head><body></body></html>';
  document.body.append(frame);await loaded;
  const doc=frame.contentDocument;
  doc.documentElement.classList.add('reading','capture-document');
  const css=doc.createElement('style');css.textContent=`html,body{margin:0;width:${width}px;overflow:visible!important}.panel{height:auto!important;min-height:${captureHeight}px;overflow:visible!important;contain:none!important;visibility:visible!important;transform:none!important;border-radius:0!important}.panel-inner{transform:none!important}.kinetic,.proof-row{transform:none!important;opacity:1!important}.actions,.feedback,.rec-bottom,.rec-footer,.library-toolbar,.library-footer,.library-details,.phase-links,.tier-nav{display:none!important}.rec-card .reason{display:block!important;-webkit-line-clamp:unset!important;overflow:visible!important}.panel,.panel-inner{animation:none!important;transition:none!important}.capture-note{font-size:11px;line-height:1.8;color:#76806e;margin-top:18px}`;
  doc.head.append(css);
  const copies=els.map(el=>{const copy=el.cloneNode(true);copy.removeAttribute('aria-hidden');copy.removeAttribute('inert');copy.classList.remove('is-rendered');copy.style.transform='';copy.querySelectorAll('[style*="transform"]').forEach(e=>e.style.transform='');doc.body.append(copy);return copy;});
  const note=doc.createElement('p');note.className='capture-note';note.textContent=`曲库截图：当前筛选与分页（${$('#result-count').textContent}，第 ${$('#page-number').textContent} 页）。搜索：${$('#library-search').value.trim()||'未筛选'}；排序：${$('#library-order').selectedOptions[0].textContent}。完整曲库请在 HTML 报告中检索。`;copies.find(e=>e.id==='library').querySelector('.panel-inner').append(note);
  copies.forEach(copy=>copy.querySelectorAll('.rec-card').forEach(card=>{const i=+card.id.split('-').at(-1),value=feedback[feedbackKey(i)];if(value){const label=doc.createElement('p');label.className='capture-note';label.textContent='试听反馈：'+feedbackLabels[value];card.append(label);}}));
  await doc.fonts.ready;await Promise.all([...doc.images].map(img=>img.decode().catch(()=>{throw Error('封面未能解码，请重新打开报告后重试。');})));
  const heights=copies.map(el=>Math.ceil(el.getBoundingClientRect().height)),total=heights.reduce((a,b)=>a+b,0);
  const quality=$('#export-quality').value,scale=quality==='fit'?Math.min(1,14900/total,Math.sqrt(11900000/(width*total))):Number(quality);
  const pixelWidth=Math.floor(width*scale),limit=Math.min(15000,Math.floor((quality==='fit'?12000000:24000000)/pixelWidth)),groups=[];
  let group={first:0,last:0,height:0};
  for(let i=0;i<copies.length;i++){
   const h=Math.ceil(heights[i]*scale);
   if(group.height&&group.height+h>limit){groups.push(group);group={first:i,last:i,height:0};}
   group.last=i;group.height+=h;
  }
  if(group.height)groups.push(group);
  progress.max=copies.length;let done=0;const results=[];
  const filename=`${R.title.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'-')||'声迹'}-长截图`;
  async function captureGroup(g){
   if(exportCancelled)throw Error('已取消导出，可重新生成。');
   try{output=allocateExportCanvas(pixelWidth,g.height);}catch(error){
    if(output){output.width=0;output.height=0;output=null;}
    if(g.first===g.last)throw Error('当前设备无法生成此清晰度，请选择较低档位重试。');
    const mid=Math.floor((g.first+g.last)/2),leftHeight=heights.slice(g.first,mid+1).reduce((sum,h)=>sum+Math.ceil(h*scale),0);
    await captureGroup({first:g.first,last:mid,height:leftHeight});await captureGroup({first:mid+1,last:g.last,height:g.height-leftHeight});return;
   }
   const ctx=output.getContext('2d');let y=0;
   for(let i=g.first;i<=g.last;i++){
    if(exportCancelled)throw Error('已取消导出，可重新生成。');
    exportStatus(`正在生成 ${i+1} / ${copies.length}：${panels[i].label}`);
    const part=await html2canvas(copies[i],{backgroundColor:null,scale,logging:false,useCORS:false,allowTaint:false,windowWidth:width,windowHeight:captureHeight,scrollX:0,scrollY:0});
    const h=Math.ceil(heights[i]*scale);ctx.drawImage(part,0,y,pixelWidth,h);part.width=0;part.height=0;y+=h;progress.value=++done;
    await new Promise(resolve=>setTimeout(resolve,0));
   }
   const blob=await canvasBlob(output);if(exportCancelled)throw Error('已取消导出，可重新生成。');
   const url=URL.createObjectURL(blob);exportURLs.push(url);results.push({...g,url});output.width=0;output.height=0;output=null;
  }
  for(const g of groups)await captureGroup(g);
  const first=results[0],preview=document.createElement('img');preview.alt='报告长截图预览 · 第 1 段';preview.src=first.url;$('#export-preview').replaceChildren(preview);$('#download-image').href=first.url;$('#open-image').href=first.url;
  $('#download-image').download=`${filename}${results.length>1?'-01':''}.png`;$('#download-image').textContent=results.length>1?'下载第 1 段 ↓':'下载 PNG ↓';
  $('#export-size').textContent=`${pixelWidth} 像素宽 · ${copies.length} 个页面 · ${results.length} 张${quality==='fit'?'整图':` · ${scale} 倍清晰度`}`;
  if(results.length>1)$('#export-parts').innerHTML=results.map((r,i)=>`<div class="export-part"><span>第 ${i+1} / ${results.length} 段 · ${pixelWidth} × ${r.height} px<br>${esc(panels[r.first].label)} → ${esc(panels[r.last].label)}</span><a href="${r.url}" download="${esc(filename)}-${String(i+1).padStart(2,'0')}.png">下载</a><a href="${r.url}" target="_blank" rel="noopener">打开</a></div>`).join('');
  $('#export-result').hidden=false;exportStatus('长截图已生成，可以下载或打开图片保存。');exportStart.textContent='重新生成';
 }catch(error){releaseExport();exportStatus(`生成未完成：${error.message||'请重试。'}`);}
 finally{frame?.remove();if(output){output.width=0;output.height=0;}progress.hidden=true;exportBusy=false;exportStart.disabled=false;exportTrigger.disabled=false;$('#export-quality').disabled=false;}
};
